services:
  - type: web
    name: seagle
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: META_API_KEY
        sync: false
      - key: META_BASE_URL
        value: https://api.meta.ai/v1
      - key: META_MODEL
        value: muse-spark-1.3
      - key: META_VISION_MODEL
        value: muse-spark-1.3
